<!DOCTYPE html>
<head lang="ko">
    <meta charset="UTF-8">
    <title>선택자</title>
    <script src="../../../jquery.js">
    </script>
    <script>
    $(function(){
        // 선택한 요소 중 지정한 숫자에 위치한 요소 선택
        $("#menu1 li:nth-child(1)")
        .css("background-color", "#ff0");

        // 선택한 요소 중 지정한 배수에 위치한 요소 선택
        $("#menu1 li:nth-child(2n)")
        .css("background-color", "#f00");

        // 선택한 요소 중 마지막에 위치한 요소 선택
        $("#menu2 li:nth-last-child(2)")
        .css("background-color", "#0ff");
    });
    </script>
</head>
<body>
    <h1 class="title">탐색 선택자</h1>
    <ul id="menu1">
        <li>내용1-1</li>
        <li>내용1-2</li>
        <li>내용1-3</li>
        <li>내용1-4</li>
    </ul>
    <ul id="menu2">
        <li>내용2-1</li>
        <li>내용2-2</li>
        <li>내용2-3</li>
    </ul>
</body>

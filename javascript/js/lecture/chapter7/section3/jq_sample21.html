<!DOCTYPE html>
<head lang="ko">
    <meta charset="UTF-8">
    <title>선택자</title>
    <script src="../../../jquery.js">
    </script>
    <script>
    $(function(){
        // 선택한 요소 중 홀수 번째 (짝수 인덱스) 요소만 선택
        $("#menu li:even")
        .css("border", "2px dashed #ff0");

        // 선택한 요소 중 짝수 번째 (홀수 인덱스) 요소만 선택
        $("#menu li:odd")
        .css("border", "2px dashed #0ff");
    });
    </script>
</head>
<body>
    <h1 class="title">탐색 선택자</h1>
    <ul id="menu">
        <li>내용1</li>
        <li>내용2</li>
        <li>내용3</li>
        <li>내용4</li>
    </ul>
</body>

<!DOCTYPE html>
<head lang="ko">
    <meta charset="UTF-8">
    <title>선택자</title>
    <script src="../../../jquery.js">
    </script>
    <script>
    $(function(){
        // 선택한 <p> 요소 중 숨어 있는 상태의 요소만 선택
        $("#wrap p:hidden").css({
            "display": "block",
            "background": "#ff0"
        });

        // id 값이 'zone1'인 요소의 하위 <select> 요소 중 선택된 selected된 <option> 요소만 선택
        var z1 = $("#zone1 :selected").val();
        console.log(z1);

        // id 값이 'zone2'인 요소의 하위 <input> 요소 중 선택된 checked된 <input> 요소만 선택
        var z2 = $("#zone2 :checked").val();
        console.log(z2);

        // id 값이 'zone3'인 요소의 하위 <input> 요소 중 선택된 checked된 <input> 요소만 선택
        var z3 = $("#zone3 :checked").val();
        console.log(z3);
    });
    </script>
</head>
<body>
    <div id="wrap">
        <p>내용1</p>
        <p style="display: none">내용2</p>
        <p>내용3</p>
    </div>
    <form action="#">
        <p id="zone1">
            <select name="course" id="course">
                <option value="opt1">옵션1</option>
                <option value="opt2" selected>옵션2</option>
                <option value="opt3">옵션3</option>
            </select>
        </p>
        <p id="zone2">
            <input type="checkbox" name="hobby1" value="독서">독서</input>
            <input type="checkbox" name="hobby2" value="자전거">자전거</input>
            <input type="checkbox" name="hobby3" value="등산" checked>등산</input>
        </p>
        <p id="zone3">
            <input type="radio" name="gender" value="male">남성</input>
            <input type="radio" name="gender" value="female" checked>여성</input>
        </p>
    </form>
</body>

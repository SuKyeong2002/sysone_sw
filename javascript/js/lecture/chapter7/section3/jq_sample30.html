<!DOCTYPE html>
<head lang="ko">
    <meta charset="UTF-8">
    <title>선택자</title>
    <script src="../../../jquery.js">
    </script>
    <script>
    $(function(){
        // naver: 연두색
        $("#wrap a[href^=https]")
        .css({"color": "#0f0"})

        // easyspub: 빨간색
        $("#wrap a[target]")
        .css({"color": "#f00"})

        // daum: 파란색
        $("#wrap a[href$=net]")
        .css({"color": "#00f"})

        // google: 검은색
        $("#wrap a[href*=google]")
        .css({"color": "#000"})

        // 아이디 입력란: 노란색 배경화면
        $("#member_f :text")
        .css({"background-color": "#ff0"})
    
        // 비밀번호 입력란: 하늘색 배경화면
        $("#member_f :password")
        .css({"background-color": "#0ff"})
    });
    </script>
</head>
<body>
    <div id="wrap">
        <p><a href="https://easyspub.co.kr" target="_blank">EasysPub</a>
        <p><a href="https://naver.com">Naver</a></p>
        <p><a href="https://google.co.kr">Google</a></p>
        <p><a href="https://daum.net">Daum</a></p>
    </div>
    <form action="#" method="get" id="member_f">
        <p>
            <label for="user_id">아이디</label>
            <input type="text" name="user_id" id="user_id">
        </p>
        <p>
            <label for="user_pw">비밀번호</label>
            <input type="password" name="user_pw" id="user_pw">
        </p>
    </form>
</body>

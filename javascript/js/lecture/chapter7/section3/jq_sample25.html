<!DOCTYPE html>
<head lang="ko">
    <meta charset="UTF-8">
    <title>선택자</title>
    <script src="../../../jquery.js">
    </script>
    <script>
    $(function(){
        // 지정 구간 인덱스의 요소 선택 (start ~ last - 1)
        $("#menu1 li").slice(1, 3)
        .css("background-color", "#ff0");

        // 선택한 요소가 부모 요소에게 하나뿐인 자식 요소면 선택
        $("li:only-child")
        .css("background-color", "#0ff");

    });
    </script>
</head>
<body>
    <h1 class="title">탐색 선택자</h1>
    <ul id="menu1">
        <li>내용1-1</li>
        <li>내용1-2</li>
        <li>내용1-3</li>
        <li>내용1-4</li>
    </ul>
    <ul id="menu2">
        <li>내용2-1</li>
    </ul>
</body>

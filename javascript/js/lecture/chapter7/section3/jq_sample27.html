<!DOCTYPE html>
<head lang="ko">
    <meta charset="UTF-8">
    <title>선택자</title>
    <script src="../../../jquery.js">
    </script>
    <script>
    $(function(){
        var arr1 = [{
            "area": "서울",
            "name": "무대리"
        }, {
            "area": "부산",
            "name": "홍대리"
        }, {
            "area": "대전",
            "name": "박사장"
        }, {
            "area": "서울",
            "name": "빅마마"
        },         
    ]

    // 반환된 데이터는 새로운 배열에 저장되고 새롭게 가공된 배열 객체 반환
    var arr2 = $.map(arr1, function(a, b) {
        if(a.area == "서울") {
            return a;
        }
    })

    console.log(arr2);
    console.log("==== First End ====");

    var arr3 = $.grep(arr1, function(a, b) {
        if(a.area == "서울") {
            return true;
        } else {
            return false;
        }
    });
    
    console.log(arr3);
    console.log("==== Second End ====");
    });
    </script>
</head>

</body>

<!DOCTYPE html>
<head lang="ko">
    <meta charset="UTF-8">
    <title>선택자</title>
    <script src="../../../jquery.js">
    </script>
    <script>
    $(function(){
        var style_1 = {
            "background-color": "#0ff",
            "border": "2px dashed #f00"
        }

         // 내용1, 내용2
        $(".txt3").prevUntil(".title")
        .css(style_1);

        // 내용4, 내용5
        $(".txt3").nextUntil(".txt6")
        .css(style_1);
    });
    </script>
</head>
<body>
    <div id="wrap">
    <h1 class="title">선택자</h1>
    <p>내용1</p>
    <p>내용2</p>
    <p class="txt3">내용3</p>
    <p>내용4</p>
    <p>내용5</p>
    <p class="txt6">내용6</p>
    </div>
</body>
